<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>💗 Para Bonky 💗</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; width:100%;
    overscroll-behavior:none;
    touch-action:none;
  }
  body {
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at top, #2a1030, #0c0510 80%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
  }
  #wrap {
    position:relative;
    width:100%;
    height:100%;
    max-width:480px;
    max-height:100vh;
    margin:0 auto;
  }
  @media (min-width:520px) and (min-height:700px){
    #wrap{
      width:420px;
      height:660px;
      border-radius:26px;
      overflow:hidden;
      box-shadow: 0 0 60px rgba(255,110,199,0.3), 0 0 0 2px rgba(255,255,255,0.08) inset;
    }
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  #hud {
    position:absolute;
    top:14px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 18px;
    color:#fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events:none;
    z-index:4;
  }
  #hud .score { font-size:19px; font-weight:700; letter-spacing:0.5px; }
  #hud .lives { font-size:18px; letter-spacing:2px; }

  #message {
    position:absolute;
    left:50%; top:34%;
    transform: translate(-50%,-50%) scale(0.7);
    background: rgba(255,245,250,0.97);
    color:#7a2657;
    padding:18px 24px;
    border-radius:22px;
    font-size:17px;
    font-weight:700;
    text-align:center;
    max-width:82%;
    opacity:0;
    border: 3px solid #ff9ec4;
    transition: all 0.45s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    pointer-events:none;
    z-index:6;
  }
  #message.show { opacity:1; transform: translate(-50%,-50%) scale(1); }

  #flash {
    position:absolute; inset:0;
    background: rgba(255,60,120,0.35);
    opacity:0;
    pointer-events:none;
    z-index:3;
    transition: opacity 0.15s;
  }
  #flash.show { opacity:1; }

  #start-screen, #reset-screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(180deg, rgba(12,5,16,0.95), rgba(42,16,48,0.95));
    color:#fff; text-align:center; padding:30px;
    z-index:10;
  }
  #reset-screen { display:none; }
  .bow { font-size:30px; margin-bottom:6px; }
  #start-screen h1, #reset-screen h1 { font-size:24px; margin-bottom:12px; color:#ffb3d9; }
  #start-screen p, #reset-screen p { font-size:14px; opacity:0.9; margin-bottom:20px; max-width:340px; line-height:1.6; }
  .btn {
    background: linear-gradient(135deg,#ff6ec7,#8b5cf6);
    border:none; color:#fff; font-weight:700;
    padding:14px 30px; border-radius:30px; font-size:15px;
    cursor:pointer; box-shadow: 0 6px 20px rgba(255,110,199,0.5);
    transition: transform 0.15s;
  }
  .btn:hover { transform: scale(1.05); }
  #footer-hint {
    position:absolute; bottom:10px; left:0; right:0;
    text-align:center; color:rgba(255,255,255,0.5); font-size:11px;
    pointer-events:none; z-index:4;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="flash"></div>
  <div id="hud">
    <div class="score">💗 <span id="score-val">0</span></div>
    <div class="lives" id="lives">🖤🖤🖤</div>
  </div>
  <canvas id="game"></canvas>
  <div id="message"></div>
  <div id="footer-hint">Desliza o usa ← → para moverte</div>

  <div id="start-screen">
    <div class="bow">🎀</div>
    <h1>Para ti, Bonky</h1>
    <p>Atrapa las estrellitas, moños y corazones 💗✨<br>
    Esquiva las nubes de negatividad ⛈️ — >:v<br><br>
    <button class="btn" id="start-btn">Empezar 🎀</button>
  </div>

  <div id="reset-screen">
    <div class="bow">🖤</div>
    <h1>Está bien tropezar</h1>
    <p id="reset-msg">A veces las nubes pesan más de la cuenta.<br>Eso no borra nada de lo bueno que ya lograste uwu</p>
    <button class="btn" id="reset-btn">Seguir intentando 🎀</button>
  </div>
</div>

<script>
const NAME = "Bonky";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');

let W, H, DPR;
let cat = { x:0, targetX:0, y:0, invuln:0 };
let bgStars = Array.from({length:55}, () => ({ x:0, y:0, r:Math.random()*1.6+0.4, tw:Math.random()*Math.PI*2 }));

function resizeCanvas(){
  const rect = wrap.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width; H = rect.height;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cat.y = H - 74;
  if (!cat.x) { cat.x = W/2; cat.targetX = W/2; }
  bgStars.forEach(s => { s.x = Math.random()*W; s.y = Math.random()*H*0.7; });
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

const goodMessages = [
  `${NAME}, eres más fuerte de lo que crees 💕`,
  `Está bien no estar bien todo el tiempo uwu 🌙`,
  `Alguien piensa en ti justo ahora, ${NAME} 🥹✨`,
  `Respira. Ya lo estás haciendo genial 🎀`,
  `Bonky, tú importas. De verdad 💗`,
  `Mereces cosas buenas, aunque hoy no lo sientas 💫`,
  `Tu forma de ser vale muchísimo, ${NAME} 🖤`,
  `No estás sola en esto 🤍`,
  `Piensa en timado ewe`,
  `Eres alguien importante, ${NAME}. Siempre 🌟`,
  `Un abrazo invisible te está llegando ahora 🫂`,
  `Lo que opinen otros no decide tu valor, ${NAME} 🎀`
];
const dodgeMessages = [
  `Esa nube no te define, ${NAME} 🖤`,
  `Las palabras feas resbalan >:V 🌧️➡️`,
  `Sigue, vas muy bien 💗`
];
let usedGood = [];

function pickMessage(pool, used){
  const remaining = pool.filter(m => !used.includes(m));
  const chosen = (remaining.length ? remaining : pool)[Math.floor(Math.random()*(remaining.length?remaining.length:pool.length))];
  used.push(chosen);
  if (used.length > pool.length) used.length = 0;
  return chosen;
}
function showMessage(pool, used){
  const el = document.getElementById('message');
  el.textContent = pickMessage(pool, used);
  el.classList.add('show');
  clearTimeout(showMessage._t);
  showMessage._t = setTimeout(()=> el.classList.remove('show'), 2000);
}

let items = [];
let clouds = [];
let score = 0;
let lives = 3;
let running = false;
let lastSpawn = 0, lastCloudSpawn = 0;

function spawnItem(){
  const kinds = ['star','heart','bow'];
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  items.push({ x: 26+Math.random()*(W-52), y:-20, speed:1.3+Math.random()*1.5, kind, rot:Math.random()*Math.PI*2, size:20+Math.random()*9 });
}
function spawnCloud(){
  clouds.push({ x: 26+Math.random()*(W-52), y:-30, speed:1.6+Math.random()*1.8, driftDir: Math.random()<0.5?-1:1, drift:0, size:26+Math.random()*10 });
}

function drawEmoji(x,y,size,rot,glyph,glowColor){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.font = size+"px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 12;
  ctx.fillText(glyph, 0, 0);
  ctx.restore();
}

function drawBackground(t){
  ctx.clearRect(0,0,W,H);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1c0e2a');
  g.addColorStop(0.35,'#3a1240');
  g.addColorStop(0.7,'#7a2470');
  g.addColorStop(1,'#c9448f');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // luna con moñito
  ctx.save();
  ctx.beginPath();
  ctx.arc(W-56, 56, 24, 0, Math.PI*2);
  ctx.fillStyle = "#ffe9f5";
  ctx.shadowColor = "#ff9ec4";
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.restore();
  drawEmoji(W-56, 30, 16, 0, "🎀", "transparent");

  bgStars.forEach(s=>{
    const a = 0.35 + 0.5*Math.abs(Math.sin(t/900 + s.tw));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  });

  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.quadraticCurveTo(W*0.25, H-88, W*0.5, H-58);
  ctx.quadraticCurveTo(W*0.75, H-28, W, H-68);
  ctx.lineTo(W,H); ctx.closePath();
  ctx.fillStyle = "rgba(15,5,25,0.55)";
  ctx.fill();
}

// mascota original: gatita rosa/negra con moño (no es Hello Kitty/Kuromi, diseño propio)
function drawCat(){
  const blink = cat.invuln > 0 && Math.floor(cat.invuln/6)%2===0;
  ctx.save();
  ctx.globalAlpha = blink ? 0.4 : 1;
  ctx.translate(cat.x, cat.y);

  // cuerpo
  ctx.beginPath();
  ctx.ellipse(0, 6, 20, 17, 0, 0, Math.PI*2);
  ctx.fillStyle = "#2b1330";
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, 6, 15, 12, 0, 0, Math.PI*2);
  ctx.fillStyle = "#ffd6ea";
  ctx.fill();

  // orejas
  ctx.fillStyle = "#2b1330";
  ctx.beginPath();
  ctx.moveTo(-16,-8); ctx.lineTo(-24,-24); ctx.lineTo(-6,-16); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(16,-8); ctx.lineTo(24,-24); ctx.lineTo(6,-16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ff9ec4";
  ctx.beginPath();
  ctx.moveTo(-14,-11); ctx.lineTo(-19,-20); ctx.lineTo(-9,-15); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(14,-11); ctx.lineTo(19,-20); ctx.lineTo(9,-15); ctx.closePath(); ctx.fill();

  // ojos
  ctx.fillStyle = "#2b1330";
  ctx.beginPath(); ctx.arc(-6,2,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(6,2,2.2,0,Math.PI*2); ctx.fill();
  // mejillas
  ctx.fillStyle = "rgba(255,150,190,0.6)";
  ctx.beginPath(); ctx.arc(-11,7,2.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(11,7,2.6,0,Math.PI*2); ctx.fill();
  // bigotes
  ctx.strokeStyle = "rgba(43,19,48,0.5)";
  ctx.lineWidth = 1;
  [[-4,-14,-4],[4,14,-4],[-4,-15,1],[4,15,1]].forEach(()=>{});
  ctx.beginPath(); ctx.moveTo(-9,6); ctx.lineTo(-19,4); ctx.moveTo(-9,9); ctx.lineTo(-19,10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,6); ctx.lineTo(19,4); ctx.moveTo(9,9); ctx.lineTo(19,10); ctx.stroke();

  // moño
  ctx.fillStyle = "#ff2f7e";
  ctx.beginPath();
  ctx.moveTo(-10,-19); ctx.lineTo(-2,-14); ctx.lineTo(-10,-9); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10,-19); ctx.lineTo(2,-14); ctx.lineTo(10,-9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(-2,-14,2.4,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// nube de negatividad (abstracta, sin insultos escritos)
function drawCloud(c){
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.globalAlpha = 0.92;
  ctx.beginPath();
  ctx.arc(-c.size*0.5, 0, c.size*0.45, 0, Math.PI*2);
  ctx.arc(0, -c.size*0.25, c.size*0.5, 0, Math.PI*2);
  ctx.arc(c.size*0.5, 0, c.size*0.45, 0, Math.PI*2);
  ctx.arc(0, c.size*0.15, c.size*0.55, 0, Math.PI*2);
  ctx.fillStyle = "#241028";
  ctx.shadowColor = "#8b2fb5";
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.strokeStyle = "#c060e0";
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // rayito
  ctx.fillStyle = "#c060e0";
  ctx.beginPath();
  ctx.moveTo(-3, c.size*0.3);
  ctx.lineTo(3, c.size*0.3);
  ctx.lineTo(-2, c.size*0.75);
  ctx.lineTo(1, c.size*0.5);
  ctx.lineTo(-4, c.size*0.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function updateHUD(){
  document.getElementById('score-val').textContent = score;
  document.getElementById('lives').textContent = "🖤".repeat(Math.max(lives,0)) + "🤍".repeat(Math.max(3-lives,0));
}

function flashHit(){
  const f = document.getElementById('flash');
  f.classList.add('show');
  setTimeout(()=> f.classList.remove('show'), 150);
}

function goToResetScreen(){
  running = false;
  document.getElementById('reset-screen').style.display = 'flex';
}

function update(t){
  if (!running) return;
  drawBackground(t);

  cat.x += (cat.targetX - cat.x) * 0.2;
  cat.x = Math.max(24, Math.min(W-24, cat.x));
  if (cat.invuln > 0) cat.invuln--;

  if (t - lastSpawn > 800) { spawnItem(); lastSpawn = t; }
  if (t - lastCloudSpawn > 1500) { spawnCloud(); lastCloudSpawn = t; }

  items.forEach(it => it.y += it.speed);
  clouds.forEach(c => { c.y += c.speed; c.drift += 0.04*c.driftDir; c.x += Math.sin(c.drift)*0.6; });

  items = items.filter(it => {
    const dist = Math.hypot(it.x-cat.x, it.y-cat.y);
    if (dist < 32) {
      score++;
      updateHUD();
      if (score % 5 === 0) showMessage(goodMessages, usedGood);
      return false;
    }
    return it.y < H+30;
  });

  clouds = clouds.filter(c => {
    const dist = Math.hypot(c.x-cat.x, c.y-cat.y);
    if (dist < 28 && cat.invuln === 0) {
      lives--;
      cat.invuln = 55;
      flashHit();
      updateHUD();
      if (lives <= 0) {
        setTimeout(goToResetScreen, 250);
      } else {
        showMessage(dodgeMessages, usedGood);
      }
      return false;
    }
    return c.y < H+40;
  });

  items.forEach(it => {
    const glyph = it.kind==='star' ? '⭐' : it.kind==='heart' ? '💗' : '🎀';
    const glow = it.kind==='star' ? '#ffe08a' : it.kind==='heart' ? '#ff9ec4' : '#e0a8ff';
    drawEmoji(it.x, it.y, it.size, it.rot, glyph, glow);
  });
  clouds.forEach(drawCloud);
  drawCat();

  if (running) requestAnimationFrame(update);
}

function handlePointer(clientX){
  const rect = canvas.getBoundingClientRect();
  cat.targetX = (clientX - rect.left) * (W/rect.width);
}
canvas.addEventListener('mousemove', e => handlePointer(e.clientX));
canvas.addEventListener('touchstart', e => { handlePointer(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e => { handlePointer(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') cat.targetX -= 40;
  if (e.key === 'ArrowRight') cat.targetX += 40;
});

function startGame(){
  resizeCanvas();
  score = 0; lives = 3; items = []; clouds = [];
  updateHUD();
  running = true;
  lastSpawn = performance.now();
  lastCloudSpawn = performance.now();
  requestAnimationFrame(update);
}

resizeCanvas();
updateHUD();

document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  startGame();
});
document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('reset-screen').style.display = 'none';
  startGame();
});
</script>
</body>
</html>
